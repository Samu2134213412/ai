<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anmelden</title>
<style>
  :root { --bg: #f5f5f2; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --accent: #2f5bea; --err: #c23b2e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a93; --line: #33332f; --accent: #7c9bff; --err: #ff7a6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { color: var(--err); font-size: 14px; min-height: 20px; margin: 10px 0 0; }
</style>
</head>
<body>
<form id="form">
  <h1>Website bearbeiten</h1>
  <p>Bitte mit deinem Passwort anmelden.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" autofocus required>
  <button id="btn">Anmelden</button>
  <div id="msg" role="alert"></div>
</form>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), msg = document.getElementById('msg');
  btn.disabled = true; msg.textContent = '';
  try {
    const res = await fetch('/_api/login', {
      method: 'POST', headers: { 'X-Meine-Website': '1' }, body: document.getElementById('pw').value
    });
    if (res.ok) { location.reload(); return; }
    let text = 'Anmeldung fehlgeschlagen.';
    try { text = (await res.json()).error || text; } catch {}
    msg.textContent = text;
  } catch { msg.textContent = 'Keine Verbindung zum Server.'; }
  btn.disabled = false;
  document.getElementById('pw').select();
});
</script>
</body>
</html>
