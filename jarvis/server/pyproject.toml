[project]
name = "jarvis"
version = "0.1.0"
description = "Persönlicher Assistent, lokal, mit erzwungenem Tool-Beleg"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "pydantic>=2.6",
    "psutil>=5.9",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
