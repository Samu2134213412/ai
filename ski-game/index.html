<style>
/* Layout: full-screen WebGL slope, HUD pinned to the four corners like a broadcast overlay. Single look (bright alpine day). */
:root {
  --ink: #10233d;
  --snow: #f4f8fc;
  --glacier: #cfe1ef;
  --signal: #ff6b3d;
  --panel: rgba(16, 35, 61, 0.78);
  --speed: #f2f6dc;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #b9d1e6; color: var(--ink); font-family: var(--body);
  overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
canvas { display: block; touch-action: none; }
[hidden] { display: none !important; }
#hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }
#brand {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px));
  font-family: var(--display); font-style: italic; font-weight: 800; letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.92); text-shadow: 0 2px 10px rgba(16, 35, 61, 0.35); line-height: 1;
}
#brand .b1 { font-size: 26px; }
#brand .b2 { font-size: 18px; opacity: 0.75; margin-left: 6px; }
#card {
  position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); color: var(--snow); border-radius: 10px; padding: 10px 14px; min-width: 150px;
  display: grid; gap: 4px; backdrop-filter: blur(6px);
}
#card .row { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; }
#card .lab { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.7; }
#card .val { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
#card .val.big { font-size: 28px; font-weight: 800; color: #fff; }
#speedo {
  position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  text-align: right; font-family: var(--display); font-style: italic; color: var(--speed);
  text-shadow: 0 2px 4px rgba(16, 35, 61, 0.5), 0 0 22px rgba(16, 35, 61, 0.35); line-height: 0.9;
}
#speedo .lab { font-size: 16px; font-weight: 600; letter-spacing: 0.3em; opacity: 0.85; }
#spd { font-size: 104px; font-weight: 800; font-variant-numeric: tabular-nums; }
#speedo .unit { font-size: 20px; font-weight: 600; opacity: 0.85; }
#clock { font-size: 22px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; opacity: 0.9; }
#trick {
  position: absolute; left: 50%; top: 20%; transform: translateX(-50%); text-align: center;
  font-family: var(--display); font-style: italic; color: #fff; opacity: 0; white-space: nowrap;
  text-shadow: 0 3px 16px rgba(16, 35, 61, 0.5);
}
#trick b { display: block; font-size: 46px; font-weight: 800; letter-spacing: 0.03em; }
#trick span { font-size: 26px; font-weight: 600; color: var(--signal); }
#trick.bad span { color: #fff; }
#trick.show { animation: pop 1.6s ease-out forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translateX(-50%) scale(0.8); }
  12% { opacity: 1; transform: translateX(-50%) scale(1.05); }
  22% { transform: translateX(-50%) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-18px); }
}
#overlay {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
  background: linear-gradient(180deg, rgba(16, 35, 61, 0.15), rgba(16, 35, 61, 0.55));
}
.panel {
  background: rgba(244, 248, 252, 0.94); color: var(--ink); border-radius: 14px; padding: 26px 28px 24px;
  max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(16, 35, 61, 0.35);
  max-height: calc(100% - 8px); overflow-y: auto; box-sizing: border-box; touch-action: pan-y;
}
#overlay { box-sizing: border-box; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.keys.tch { display: none; }
#pauseBtn {
  position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.7);
  background: rgba(16, 35, 61, 0.35); color: #fff; font: 800 16px var(--body); cursor: pointer; touch-action: none;
}
.panel h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: 0.02em; }
.panel .sub { margin: 4px 0 16px; font-size: 14px; color: #4d6684; }
#result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
#result div { background: #fff; border-radius: 8px; padding: 8px 10px; }
#result small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #4d6684; }
#result strong { font-family: var(--display); font-style: italic; font-size: 24px; font-variant-numeric: tabular-nums; }
#result .msg { grid-column: 1 / -1; background: none; padding: 0; font-weight: 600; color: var(--signal); }
.keys { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.keys li { display: flex; gap: 10px; align-items: baseline; }
.keys kbd {
  font-family: var(--body); font-weight: 600; font-size: 12px; min-width: 64px; text-align: center;
  background: #fff; border: 1px solid #c7d6e4; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px;
}
.btn, .lvl { font: inherit; cursor: pointer; border-radius: 10px; }
.btn {
  border: 1px solid #c7d6e4; background: #fff; color: var(--ink); padding: 12px;
  font-family: var(--display); font-style: italic; font-weight: 800; font-size: 22px; letter-spacing: 0.06em;
}
.btn.primary { background: var(--signal); border-color: var(--signal); color: #fff; }
.btn:focus-visible, .lvl:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn:hover, .lvl:hover { filter: brightness(0.97); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 14px; }
.actions.one { grid-template-columns: 1fr; }
.lvls { display: grid; gap: 8px; margin-bottom: 12px; }
.lvl { display: grid; gap: 3px; text-align: left; border: 1px solid #c7d6e4; background: #fff; color: var(--ink); padding: 10px 12px; }
.lvl .ln { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 20px; }
.lvl .ld { font-size: 13px; color: #4d6684; }
.lvl .ls { font-size: 12px; font-weight: 600; color: #4d6684; }
.lvl.done .ls { color: #1c8a4a; }
.bh { margin: 6px 0; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 20px; letter-spacing: 0.04em; }
.board { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 3px; font-size: 14px; }
.board li { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; padding: 5px 8px; background: #fff; border-radius: 6px; }
.board li.me { background: #ffe6dc; font-weight: 600; }
.board li.empty { display: block; color: #4d6684; background: none; padding: 0; }
.board .rk { color: #4d6684; font-variant-numeric: tabular-nums; }
.board .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .sc { font-family: var(--display); font-style: italic; font-weight: 800; font-variant-numeric: tabular-nums; }
.ctl { margin-top: 6px; font-size: 14px; }
.ctl summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
.ctl .keys { margin: 6px 0 4px; }
.keys.plain li { display: block; }
.msg { margin: 0 0 12px; font-weight: 600; color: var(--signal); }
.msg.dim { color: #4d6684; }
#topBtns { position: fixed; z-index: 5; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(50% + 30px); display: flex; gap: 8px; }
#fsBtn, #sndBtn {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.7);
  background: rgba(16, 35, 61, 0.35); color: #fff; cursor: pointer; touch-action: none; padding: 0;
  display: grid; place-items: center;
}
@media (max-width: 520px) {
  /* narrow phones: stack the buttons under the pause button so they clear the score card and the speedometer */
  #topBtns { left: 50%; transform: translateX(-50%); top: calc(60px + env(safe-area-inset-top, 0px)); flex-direction: column; }
  #fsBtn, #sndBtn { width: 40px; height: 40px; }
}
#fsBtn svg, #sndBtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
#fsBtn:focus-visible, #sndBtn:focus-visible, #pauseBtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
#bonus {
  position: absolute; left: 50%; top: 58%; transform: translateX(-50%); opacity: 0; white-space: nowrap;
  font-family: var(--display); font-style: italic; font-weight: 800; font-size: 22px; color: #fff; text-shadow: 0 2px 10px rgba(16, 35, 61, 0.55);
}
#bonus.show { animation: bonus 1s ease-out forwards; }
#note {
  position: fixed; z-index: 6; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  width: min(340px, calc(100% - 32px)); box-sizing: border-box; padding: 10px 14px; border-radius: 10px;
  background: rgba(16, 35, 61, 0.9); color: #fff; font-size: 14px; line-height: 1.4; text-align: center;
}
@keyframes bonus {
  0% { opacity: 0; transform: translateX(-50%) translateY(8px); }
  15% { opacity: 1; transform: translateX(-50%); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-14px); }
}
#touch {
  position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: none; align-items: flex-end;
  justify-content: space-between; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
#touch .grp { display: flex; gap: 10px; }
#touch button {
  pointer-events: auto; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.7);
  background: rgba(16, 35, 61, 0.35); color: #fff; font-size: 22px; font-family: var(--display); font-weight: 800; font-style: italic;
  touch-action: none; -webkit-user-select: none; user-select: none;
}
#touch button.on { background: rgba(255, 107, 61, 0.75); border-color: #fff; }
#touch #tJ { width: 84px; height: 84px; font-size: 24px; background: rgba(255, 107, 61, 0.55); }
#touch .col { display: flex; flex-direction: column; gap: 10px; }
@media (pointer: coarse) {
  #touch { display: flex; }
  .keys.kb { display: none; }
  .keys.tch { display: grid; }
  #card { top: calc(44px + env(safe-area-inset-top, 0px)); bottom: auto; min-width: 0; padding: 6px 10px; gap: 2px; }
  #card .val { font-size: 16px; }
  #card .val.big { font-size: 22px; }
  #speedo { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; }
  #spd { font-size: 64px; }
  #speedo .lab { font-size: 12px; }
  #speedo .unit { font-size: 15px; }
  #clock { font-size: 17px; }
  #trick { top: 34%; }
}
@media (pointer: coarse) and (max-width: 400px) { #touch button { width: 58px; height: 58px; } #touch #tJ { width: 76px; height: 76px; } #brand .b2 { display: none; } }
@media (pointer: coarse) and (max-height: 450px) { #brand { display: none; } #card { top: calc(8px + env(safe-area-inset-top, 0px)); } }
@media (max-width: 600px) {
  #spd { font-size: 72px; }
  #brand .b1 { font-size: 20px; }
  #brand .b2 { font-size: 14px; }
  #card { min-width: 120px; padding: 8px 10px; }
  #card .val.big { font-size: 22px; }
  #trick b { font-size: 32px; }
}

<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const CH_LEN = 100, CH_W = 360, SX = 90, SZ = 25, AHEAD = 5, MAX_TREES = 230, MAX_COINS = 48;
const G = 9.81;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- terrain ----------
function center(z) { return Math.sin(z * 0.0045) * 42 + Math.sin(z * 0.013 + 1.3) * 14; }
function terrainH(x, z) {
  const c = center(z), dx = x - c, ax = Math.abs(dx);
  let h = z * 0.3 + Math.sin(z * 0.008) * 7;
  h += Math.sin(x * 0.05 + z * 0.017) * 1.4 + Math.sin(z * 0.037 - x * 0.023) * 1.1 + Math.sin(x * 0.13 + z * 0.09) * 0.25;
  h += ax * ax * 0.0012;
  if (ax > 34) {
    const d = ax - 34;
    h += d * d * (dx < 0 ? 0.014 : 0.004) + Math.sin(x * 0.07) * Math.sin(z * 0.05) * d * 0.06;
  }
  return h;
}
const rampProfile = (t) => t * (0.55 + 0.45 * t);
// height of the kicker surface above the snow; a few cm extra so it never sinks into the coarser terrain mesh
const rampLift = (r, t) => rampProfile(t) * r.h + 0.1 * Math.min(1, t * 6);

// ---------- renderer / scene ----------
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 600;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG = 0xd4e3ef;
scene.fog = new THREE.Fog(FOG, 70, 480);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 4000);

scene.add(new THREE.HemisphereLight(0xe8f2ff, 0x8a9cc0, 1.8));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 260 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// sky dome
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(2500, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x3a6aa8) }, mid: { value: new THREE.Color(0x86acd6) }, hor: { value: new THREE.Color(FOG) } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 hor; varying vec3 vDir; void main(){ float h = vDir.y; vec3 c = mix(hor, mid, smoothstep(0.0, 0.2, h)); c = mix(c, top, smoothstep(0.2, 0.75, h)); gl_FragColor = vec4(c, 1.0);\n#include <colorspace_fragment>\n}',
  })
);
sky.renderOrder = -1;
scene.add(sky);

// distant mountains + clouds follow the camera
const backdrop = new THREE.Group();
scene.add(backdrop);
{
  const rng = mulberry32(42);
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, fog: false });
  const low = new THREE.Color(0x6d8cb9), mid = new THREE.Color(0x9fb8d6), top = new THREE.Color(0xf2f6fb);
  for (let i = 0; i < 18; i++) {
    const ang = -Math.PI * 0.95 + (i / 17) * Math.PI * 1.9 + (rng() - 0.5) * 0.15;
    const dist = 1100 + rng() * 500, r = 260 + rng() * 260, h = 260 + rng() * 300;
    let g = new THREE.ConeGeometry(r, h, 7, 4);
    const p = g.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const y = p.getY(k);
      if (y < h / 2 - 1) {
        const hx = Math.round(p.getX(k)), hz = Math.round(p.getZ(k)), hy = Math.round(y);
        const n = Math.sin(hx * 12.9898 + hy * 78.233 + hz * 37.719 + i) * 43758.5453;
        const j = (n - Math.floor(n) - 0.5) * r * 0.25;
        p.setX(k, p.getX(k) + j); p.setZ(k, p.getZ(k) - j * 0.6);
      }
    }
    g = g.toNonIndexed();
    const pp = g.attributes.position, col = new Float32Array(pp.count * 3), c = new THREE.Color();
    for (let k = 0; k < pp.count; k++) {
      const t = (pp.getY(k) + h / 2) / h;
      if (t > 0.62) c.copy(top); else c.copy(low).lerp(mid, t / 0.62);
      col.set([c.r, c.g, c.b], k * 3);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat);
    m.position.set(Math.sin(ang) * dist, h / 2 - 260, -Math.cos(ang) * dist);
    backdrop.add(m);
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const cx = cv.getContext('2d');
  for (let k = 0; k < 14; k++) {
    const x = 50 + rng() * 156, y = 100 + rng() * 60, rr = 30 + rng() * 50;
    const gr = cx.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 256, 256);
  }
  const cloudTex = new THREE.CanvasTexture(cv); cloudTex.colorSpace = THREE.SRGBColorSpace;
  for (let i = 0; i < 16; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, fog: false, depthWrite: false, opacity: 0.6 + rng() * 0.3 }));
    const ang = (rng() - 0.5) * Math.PI * 1.8, dist = 900 + rng() * 700;
    s.position.set(Math.sin(ang) * dist, 140 + rng() * 260, -Math.cos(ang) * dist);
    s.scale.set(500 + rng() * 500, 220 + rng() * 160, 1);
    backdrop.add(s);
  }
}

// ---------- shared materials / geometries ----------
function makeGroomTexture() {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 16;
  const cx = cv.getContext('2d');

function updateChunks(force) {
  const pc = Math.floor(-P.z / CH_LEN);
  const lo = pc - 1, hi = pc + AHEAD;

    if (!force && chunks.some((c) => c.idx === idx && !free.includes(c))) continue;
    let ch = free.pop();
    if (!ch) { ch = new Chunk(); chunks.push(ch); }
    ch.build(idx);

function emit(x, y, z, vx, vy, vz, spread) {
  const i = spray.next; spray.next = (spray.next + 1) % PN;

function updateSpray(dt) {

}

// ---------- scoring ----------
function popup(main, sub, bad) {

function land() {

const CRASH_TEXT = {

  }

function speedLimits() {

      const s = (groundAt(P.x, P.z) - groundAt(P.x + fx * 1.5, P.z + fz * 1.5)) / 1.5;
      const sinA = clamp(s / Math.sqrt(1 + s * s), -0.7, 0.6);
      const a = G * sinA - 0.3 - (input.up ? 0.0021 : 0.0039) * P.v * P.v - (input.down ? 7 : 0) + (P.boostT > 0 ? 18 : 0);
      P.v = clamp(P.v + a * dt, vMin, P.boostT > 0 ? 42 : Math.max(vMax, Math.min(P.v, 42)));
    } else {
      // rotation builds up smoothly: about 1.6 s for a full 360 / flip
      const pitchIn = (input.down ? 1 : 0) - (input.up ? 1 : 0);
      const ka = 1 - Math.exp(-dt * 6);
      P.spinV = lerp(P.spinV, steer * 3.9, ka);
      P.flipV = lerp(P.flipV, pitchIn * 4.2, ka);
      P.spin += P.spinV * dt;
      P.flip += P.flipV * dt;
      if (input.jumpHeld) P.grabT += dt;
    }

    const fx = Math.sin(P.heading), fz = -Math.cos(P.heading);
    const gOld = groundAt(P.x, P.z);
    const yPrev = P.y;
    P.x += fx * P.v * dt; P.z += fz * P.v * dt;
    const c = center(P.z); P.x = clamp(P.x, c - 130, c + 130);
    const gNew = groundAt(P.x, P.z);

    if (!P.air) {
      const ball = P.y + P.vy * dt - 0.5 * G * dt * dt;
      if (input.jumpPressed) {
        P.air = true; P.airT = 0; P.vy = (gNew - gOld) / dt + 5.4; P.y = gNew + 0.02;
        Sound.jump();
      } else if (ball > gNew + 0.1) {
        P.air = true; P.airT = 0; P.y = ball; P.vy -= G * dt;
      } else {
        P.vy = Math.min((gNew - gOld) / dt, P.v * 0.75); P.y = gNew;
      }
    } else {
      P.vy -= G * dt; P.y += P.vy * dt; P.airT += dt;
      if (P.y <= gNew) {
        P.y = gNew; P.air = false;
        land();
        if (state !== 'run') return;
        P.vy = (gNew - gOld) / dt;
      }
    }
    // kickers are solid from the sides: sliding in sideways is a crash, not a launch
    if (!P.rail) for (const ch of chunks) {
      if (P.z > ch.z0 + 2 || P.z < ch.z0 - CH_LEN - 2) continue;
      for (const r of ch.ramps) {
        if (P.z > r.z || P.z < r.z - r.L || Math.abs(P.x - r.x) >= r.w / 2) continue;
        const prevX = P.x - Math.sin(P.heading) * P.v * dt;
        const lift = rampLift(r, (r.z - P.z) / r.L);
        if (Math.abs(prevX - r.x) >= r.w / 2 && lift > 0.45 && yPrev < terrainH(P.x, P.z) + lift - 0.25) { P.y = yPrev; crash('ramp'); return; }
      }
    }
    // boost pads
    if (!P.air) for (const ch of chunks) {
      if (P.z > ch.z0 + 8 || P.z < ch.z0 - CH_LEN - 8) continue;
      for (const b of ch.boosts) {
        if (Math.abs(P.x - b.x) < b.w / 2 && P.z <= b.z && P.z >= b.z - b.L) {
          if (!(P.boostT > 0.8)) { toast('BOOST!'); Sound.boost(); navigator.vibrate?.(20); }
          P.boostT = 1.8;
        }
      }
    }
    tryMountRail();
    if (state !== 'run') return;
  }
  input.jumpPressed = false;

  P.dist = Math.max(P.dist, P.startZ - P.z);
  if (P.switch && !P.air) {
    P.swAcc += dt * 10;
    if (P.swAcc >= 1) { const n = Math.floor(P.swAcc); P.swAcc -= n; P.pts += n; }
  }

  // trees: crash on contact, bonus for a close pass
  for (const ch of chunks) {
    if (P.z > ch.z0 + 6 || P.z < ch.z0 - CH_LEN - 6) continue;
    for (const o of ch.obstacles) {
      const dx = P.x - o.x, dz = P.z - o.z, rr = o.r + 0.3, d2 = dx * dx + dz * dz;
      if (d2 > (rr + 1.4) * (rr + 1.4) || P.y - o.y >= o.top) continue;
      if (d2 < rr * rr) { crash('tree'); return; }
      if (!o.nm && P.v > 8) { o.nm = true; P.pts += 25; toast('KNAPP VORBEI +25'); Sound.nearMiss(); }
    }
    for (const k of ch.coins) {
      if (k.taken) continue;
      const dx = P.x - k.x, dz = P.z - k.z, dy = P.y + 0.9 - k.y;
      if (dx * dx + dz * dz < 2.1 && Math.abs(dy) < 2) { k.taken = true; P.pts += 50; toast('KRISTALL +50'); Sound.coin(); for (let i = 0; i < 12; i++) emit(k.x, k.y, k.z, 0, 1, 0, 3); }
    }
  }

  if (level) {
    while (level.nextGate < level.gates.length && P.z <= level.gates[level.nextGate].z) {
      const g = level.gates[level.nextGate++];
      if (Math.abs(P.x - g.x) <= g.w / 2) { level.passed++; P.pts += 100; Sound.gate(); toast(`TOR ${level.passed}/${level.gates.length} +100`); }
      else if (level.goal === 'gates') { crash('gate'); return; }
    }
    if (P.z <= level.finishZ) { finishLevel(); return; }
  }

  // snow spray from the skis
  if (!P.air && !P.rail && P.v > 3) {
    const fx = Math.sin(P.heading), fz = -Math.cos(P.heading);
    const rx = Math.cos(P.heading), rz = Math.sin(P.heading);
    spray.acc += P.v * dt * (1.2 + Math.abs(steer) * 5 + (input.down ? 7 : 0));
    while (spray.acc >= 1) {
      spray.acc -= 1;
      const sd = Math.random() < 0.5 ? -1 : 1;
      emit(P.x - fx * 0.5 + rx * sd * 0.16, P.y + 0.06, P.z - fz * 0.5 + rz * sd * 0.16,
        -fx * P.v * 0.12 - rx * steer * P.v * 0.22, 1 + Math.abs(steer) * 1.5, -fz * P.v * 0.12 - rz * steer * P.v * 0.22, 1.4);
    }
  }
  if (P.boostT > 0) emit(P.x, P.y + 0.4, P.z, (Math.random() - 0.5) * 2, 1, (Math.random() - 0.5) * 2, 1);
  P.steerIn = P.rail ? 0 : steer;
}

// after the finish line: glide out and stop
function coast(dt) {
  P.v = Math.max(0, P.v - 9 * dt);
  P.heading *= 1 - 2 * dt;
  P.x += Math.sin(P.heading) * P.v * dt; P.z -= Math.cos(P.heading) * P.v * dt;
  P.vy = 0; P.air = false; P.y = groundAt(P.x, P.z);
  P.spin = 0; P.flip = 0; P.steerIn = 0;
}

// ---------- visuals ----------
const camLook = new THREE.Vector3();
let camYaw = 0;
function updateVisuals(dt) {
  const k = 1 - Math.exp(-dt * 8);
  skier.position.set(P.x, P.y, P.z);
  const PIVOT = 0.95;
  const steer = state === 'run' && !P.air ? P.steerIn || 0 : 0;
  P.steerVis = lerp(P.steerVis, steer, k);
  if (state === 'over') {
    P.deadT += dt;
    skier.rotation.z = lerp(skier.rotation.z, 1.45, 1 - Math.exp(-dt * 6));
    skier.rotation.x = lerp(skier.rotation.x, 0.3, k);
    return;
  }
  P.railYaw = lerp(P.railYaw || 0, P.rail ? Math.PI / 2 : 0, k);
  skier.rotation.y = -(P.heading + P.spin + (P.switch ? Math.PI : 0) + P.railYaw);
  if (!P.air) {
    const fx = Math.sin(P.heading), fz = -Math.cos(P.heading);
    const s = (groundAt(P.x - fx, P.z - fz) - groundAt(P.x + fx, P.z + fz)) / 2;
    P.pitch = lerp(P.pitch, -Math.atan(s) * 0.85, k);
  } else {
    P.pitch = lerp(P.pitch, P.grabT > 0 ? 0.15 : -0.1, 1 - Math.exp(-dt * 3));
  }
  skier.rotation.x = (P.switch ? -P.pitch : P.pitch) + P.flip;
  // flip around the body's middle instead of the feet
  if (P.flip) {
    const v = new THREE.Vector3(0, PIVOT, 0).applyEuler(skier.rotation);
    skier.position.set(P.x, P.y + PIVOT, P.z).sub(v);
  }
  skier.rotation.z = 0;
  body.rotation.z = -P.steerVis * 0.4 * (P.switch ? -1 : 1);
  const grab = P.air && input.jumpHeld;
  const crouch = grab ? 0.72 : (!P.air && input.up && state === 'run') ? 0.84 : 1;
  body.scale.y = lerp(body.scale.y, crouch, k);
  body.rotation.x = lerp(body.rotation.x, grab ? -0.35 : 0, k);
}

function updateCamera(dt) {
  const k = 1 - Math.exp(-dt * 5);
  camYaw = lerp(camYaw, P.heading * 0.55, 1 - Math.exp(-dt * 3));
  const fx = Math.sin(camYaw), fz = -Math.cos(camYaw);
  const portrait = camera.aspect < 1;
  const dist = (state === 'menu' ? 7 : 8.5) + (portrait ? 1.5 : 0);
  const tx = P.x - fx * dist, tz = P.z - fz * dist;
  const ty = Math.max(P.y + 5.4 + (portrait ? 1 : 0), groundAt(tx, tz) + 2.5);
  const kk = state === 'menu' ? 1 : k;
  camera.position.x = lerp(camera.position.x, tx, kk);
  camera.position.z = lerp(camera.position.z, tz, kk);
  camera.position.y = lerp(camera.position.y, ty, kk);
  if (P.shake > 0) {
    P.shake -= dt;
    const a = Math.max(0, P.shake) * 0.5;
    camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a;
  }
  camLook.set(P.x + fx * 11, P.y + 0.2, P.z + fz * 11);
  camera.lookAt(camLook);
  const fov = 62 + (portrait ? (1 - camera.aspect) * 40 : 0) + Math.min(16, P.v * 0.4);
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = lerp(camera.fov, fov, k); camera.updateProjectionMatrix(); }

  sky.position.copy(camera.position);
  backdrop.position.set(camera.position.x, P.y, camera.position.z);
  sun.position.set(P.x + 40, P.y + 80, P.z + 30);
  sun.target.position.set(P.x, P.y, P.z - 10);
}

function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; }
let lastHud = '';
function updateHud() {
  const kmh = Math.round(P.v * 3.6), score = Math.floor(P.dist) + P.pts;
  let goal;
  if (!level) goal = Math.max(best, score).toLocaleString('de-DE');
  else if (level.goal === 'tricks') goal = `${P.trickPts.toLocaleString('de-DE')} / ${level.target.toLocaleString('de-DE')}`;
  else if (level.goal === 'gates') goal = `${level.passed} / ${level.gates.length}`;
  else goal = `${Math.max(0, Math.ceil(P.z - level.finishZ))} m`;
  const d = P.dist >= 1000 ? `${(P.dist / 1000).toFixed(2).replace('.', ',')} km` : `${Math.floor(P.dist)} m`;
  const key = `${kmh}|${score}|${d}|${Math.floor(P.time)}|${goal}`;
  if (key === lastHud) return;
  lastHud = key;
  $('spd').textContent = kmh;
  $('score').textContent = score.toLocaleString('de-DE');
  $('dist').textContent = d;
  $('clock').textContent = fmtTime(P.time);
  $('goalVal').textContent = goal;
}

const coinM = new THREE.Matrix4(), coinQ = new THREE.Quaternion(), coinS = new THREE.Vector3(), coinP = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0);
function updateCoins(t) {
  for (const ch of chunks) {
    if (!ch.coins.length) continue;
    ch.coins.forEach((k, i) => {
      coinQ.setFromAxisAngle(Y, t * 2.2 + i);
      coinS.setScalar(k.taken ? 0 : 1);
      coinM.compose(coinP.set(k.x, k.y + Math.sin(t * 3 + i) * 0.15, k.z), coinQ, coinS);
      ch.coinMesh.setMatrixAt(i, coinM);
    });
    ch.coinMesh.instanceMatrix.needsUpdate = true;
  }
}

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state === 'run') { step(dt); updateChunks(false); } else if (state === 'done') coast(dt);
  updateCoins(clock.elapsedTime);
  updateVisuals(dt);
  updateSpray(dt);
  updateCamera(dt);
  updateFlakes(dt);
  updateHud();
  Sound.update(P.v, (P.steerIn ? 0.6 : 0) + (input.down ? 1 : 0),
    state !== 'run' ? 'off' : P.rail ? 'rail' : P.air ? 'air' : 'snow');
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
updateCamera(1);
showMenu();
frame();
</script>
