[workspace]
resolver = "2"
members = ["core", "storage", "intelligence", "scanners", "response", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
yara-x = "1.20"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
