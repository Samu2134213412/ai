plugins {
    id 'net.fabricmc.fabric-loom'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base { archivesName = 'pvpbot-autopilot' }

// The learning brain is shared with the bot mod. It is copied into this mod's own package so both
// mods can be installed side by side without clashing classes.
def sharedBrain = layout.buildDirectory.dir('generated/sharedBrain')
tasks.register('copySharedBrain', Copy) {
    from('../src/main/java/de/samu/pvpbot/brain')
    into(sharedBrain.map { it.dir('de/samu/pvpbot/autopilot/brain') })
    filter { String line -> line.replace('package de.samu.pvpbot.brain', 'package de.samu.pvpbot.autopilot.brain') }
}
sourceSets.main.java.srcDir(sharedBrain)
tasks.named('compileJava') { dependsOn 'copySharedBrain' }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'pvpbot-autopilot-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    // Simple Voice Chat (required) and the Claude SDK (AI chat)
    maven { url = "https://maven.maxhenkel.de/repository/public" }
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    mavenCentral()
}

// Claude SDK for the AI chat: bundled into the mod jar (with everything it needs).
configurations {
    bundled
    implementation.extendsFrom bundled
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Simple Voice Chat is required: its API to compile against, the mod itself for the in-game test.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    runtimeOnly "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

    bundled "com.anthropic:anthropic-java:${project.anthropic_version}"

    // The bot mod is only loaded in the in-game test, for a duel "autopilot vs. bot".
    gametestRuntimeOnly project(':')
}

// Every jar of the SDK (and its dependencies) goes into the mod as a nested jar.
afterEvaluate {
    configurations.bundled.resolvedConfiguration.resolvedArtifacts.each { art ->
        def id = art.moduleVersion.id
        dependencies.add("include", "${id.group}:${id.name}:${id.version}")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
