# Konfiguration für den Tutor. Alle Werte lassen sich per CLI überschreiben
# (siehe: python main.py --help).

# Ollama-Server (lokal)
host: http://localhost:11434

# Modell, das Ollama verwenden soll (vorher: ollama pull <modell>)
model: qwen2.5:32b

# Schnelles Modell: beantwortet einfache Fragen/Smalltalk/Organisatorisches automatisch (kein
# manuelles Umschalten). Alles was nach Aufgabe aussieht, geht an das große Modell oben.
# Vorher: ollama pull qwen2.5:3b   ("" = ausschalten)
light_model: qwen2.5:3b

# Vision-Modell: liest geteilte Notizseiten (Web-UI). Vorher: ollama pull qwen2.5vl:7b
vision_model: qwen2.5vl:7b

# Kreativität: niedriger = fokussierter, höher = freier
temperature: 0.6

# Fach / Thema (optional, leer lassen für allgemein), z. B. "Mathematik Klasse 9"
subject: ""

# Antwortsprache
language: Deutsch

# Hinweisstufen-Logik
hints:
  # Wie viele Nachrichten des Lernenden pro Stufe, bevor die nächste Stufe
  # (1 Leitfrage → 2 Denkanstoß → 3 Teilschritt) freigegeben wird.
  turns_per_stage: 2
  # Unter so vielen Versuchen muss /aufgeben ein zweites Mal bestätigt werden.
  min_attempts_before_giving_up: 2

# Gesprächsverlauf als JSON in sessions/ speichern
sessions:
  autosave: false        # true = beim Beenden automatisch speichern
  directory: sessions

# Web-Oberfläche (python web.py)
web:
  host: 127.0.0.1        # für das iPad: 0.0.0.0 (oder --host 0.0.0.0)
  port: 8765
