name: PvP Bot - probe API
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Gen sources
        run: ./gradlew --no-daemon genSources || true
      - name: Collect classpath
        run: |
          mkdir -p /tmp/cp
          cat > /tmp/cp.gradle <<'G'
          allprojects { tasks.register('dumpCp') { doLast { file('/tmp/cp/classpath.txt').text = configurations.compileClasspath.files.join('\n') + '\n' + configurations.findByName('clientCompileClasspath')?.files?.join('\n') } } }
          G
          ./gradlew --no-daemon -I /tmp/cp.gradle dumpCp || true
          cat /tmp/cp/classpath.txt
          while read f; do [ -f "$f" ] && cp "$f" /tmp/cp/; done < /tmp/cp/classpath.txt
          find ~/.gradle .gradle -name '*sources*.jar' -path '*minecraft*' -exec cp {} /tmp/cp/ \;
          ls -la /tmp/cp
      - uses: actions/upload-artifact@v4
        with:
          name: classpath
          path: /tmp/cp
