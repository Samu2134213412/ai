name: PvP Bot - probe API
on:
  workflow_dispatch:
    inputs:
      javap:
        description: 'Classes to print signatures for (space separated)'
        default: ''
      source:
        description: 'Classes to print decompiled source for (space separated)'
        default: ''
      grep:
        description: 'Regex over class file names in the minecraft jar'
        default: ''
      srcgrep:
        description: 'Regex to grep across all decompiled sources (prints file:line)'
        default: ''
      ranges:
        description: 'Space separated Class:start-end line ranges of decompiled sources'
        default: ''
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Gen sources
        if: ${{ inputs.source != '' || inputs.srcgrep != '' || inputs.ranges != '' }}
        run: ./gradlew --no-daemon genSources -q > /dev/null 2>&1 || true
      - name: Resolve
        if: ${{ inputs.source == '' && inputs.srcgrep == '' && inputs.ranges == '' }}
        run: ./gradlew --no-daemon dependencies -q > /dev/null 2>&1 || true
      - name: Probe
        env:
          JAVAP: ${{ inputs.javap }}
          SOURCE: ${{ inputs.source }}
          GREP: ${{ inputs.grep }}
          SRCGREP: ${{ inputs.srcgrep }}
          RANGES: ${{ inputs.ranges }}
        run: |
          JAR=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -name 'minecraft-merged-deobf-*.jar' ! -name '*sources*' | head -1)
          CP="$JAR:$(find ~/.gradle/caches/modules-2 -name '*.jar' | tr '\n' ':')"
          SRC=$(find ~/.gradle $PWD/.gradle -name 'minecraft-*sources*.jar' 2>/dev/null | head -1)
          echo "JAR=$JAR SRC=$SRC"
          if [ -n "$GREP" ]; then unzip -Z1 "$JAR" | grep -E "$GREP" | grep -v '\$' | head -400; fi
          for c in $JAVAP; do echo "=================== $c"; javap -p -cp "$CP" "$c" || true; done
          if [ -n "$SOURCE$SRCGREP$RANGES" ]; then mkdir -p /tmp/src && (cd /tmp/src && unzip -q -o "$SRC"); fi
          for c in $SOURCE; do echo "=================== $c"; cat -n "/tmp/src/$(echo $c | tr . /).java" || true; done
          if [ -n "$SRCGREP" ]; then (cd /tmp/src && grep -rnE "$SRCGREP" --include=*.java . | head -400); fi
          for r in $RANGES; do c=${r%%:*}; l=${r#*:}; echo "=================== $r"; sed -n "${l%-*},${l#*-}p" "/tmp/src/$(echo $c | tr . /).java" | cat -n | sed "s/^ *\([0-9]*\)/L\1+${l%-*}/" || true; done
