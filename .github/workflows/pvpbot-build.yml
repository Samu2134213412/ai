name: PvP Bot - build mod
on:
  push:
    branches: ['**']
    paths: ['minecraft-pvp-bot/**', '.github/workflows/pvpbot-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: pvpbot-mod
          path: minecraft-pvp-bot/build/libs/*.jar
          if-no-files-found: error
