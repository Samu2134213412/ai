name: PvP Bot - build mod
on:
  push:
    branches: ['**']
    paths: ['minecraft-pvp-bot/**', '.github/workflows/pvpbot-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: pvpbot-mod
          path: minecraft-pvp-bot/build/libs/*.jar
          if-no-files-found: error
      - name: Self-test on a real Minecraft server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\npause-when-empty-seconds=100000\ndifficulty=normal\nspawn-protection=0\ngenerate-structures=false\nview-distance=4\nsimulation-distance=6\n' > run/server.properties
          timeout 1200 ./gradlew --no-daemon runServer -Pselftest > selftest.log 2>&1 || true
          grep -E "SELFTEST|Exception|ERROR|FATAL|at de\.samu" selftest.log | head -1500
          echo "--- gespeichertes Gedaechtnis ---"; cat run/config/pvpbot-memory.json || true
          grep -q "\[SELFTEST\] DONE" selftest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: minecraft-pvp-bot/selftest.log
