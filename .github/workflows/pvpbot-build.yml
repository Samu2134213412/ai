name: PvP Bot - build mod
on:
  push:
    branches: ['**']
    paths: ['minecraft-pvp-bot/**', '.github/workflows/pvpbot-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: pvpbot-mod
          path: minecraft-pvp-bot/build/libs/*.jar
          if-no-files-found: error
      - name: Self-test on a real Minecraft server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\npause-when-empty-seconds=100000\ndifficulty=normal\nspawn-protection=0\ngenerate-structures=false\nview-distance=4\nsimulation-distance=6\n' > run/server.properties
          timeout 2400 ./gradlew --no-daemon runServer -Pselftest > selftest.log 2>&1 || true
          grep -E "SELFTEST|Exception|ERROR|FATAL|at de\.samu" selftest.log | head -1500
          echo "--- gespeichertes Gedaechtnis ---"; cat run/config/pvpbot-memory.json || true
          grep -q "\[SELFTEST\] DONE" selftest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: minecraft-pvp-bot/selftest.log

  stage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore what the bot learned in earlier runs
        uses: actions/cache/restore@v4
        with:
          path: |
            minecraft-pvp-bot/run/config/pvpbot-memory.json
            minecraft-pvp-bot/run/config/pvpbot-tasks.json
          key: pvpbot-brain-stage${{ matrix.stage }}-${{ github.run_id }}
          restore-keys: pvpbot-brain-stage${{ matrix.stage }}-
      - name: Beat the game, stage ${{ matrix.stage }}, in a normal world
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          # A new world (seed) every run, and again after each death - up to 3 tries.
          for try in 1 2 3; do
            rm -rf run/world
            printf 'online-mode=false\nlevel-type=minecraft\\:normal\nlevel-seed=pvpbot-${{ github.run_number }}-'"$try"'\npause-when-empty-seconds=100000\ndifficulty=normal\nspawn-protection=0\ngenerate-structures=true\nview-distance=4\nsimulation-distance=6\n' > run/server.properties
            timeout 5400 ./gradlew --no-daemon runServer -Pselftest -Pstagetest=${{ matrix.stage }} > stage.log 2>&1 || true
            echo "===== try $try (seed pvpbot-${{ github.run_number }}-$try): $(grep -oE '\[SELFTEST\] (PASS|FAIL).*' stage.log | head -1)"
            grep -E "bot took|bot is now|WATCHDOG|bot gone|lava:|retreat" stage.log | tail -16 || true
            grep -qE '\[SELFTEST\] FAIL.*botAlive=false' stage.log || break
          done
          grep -E "SELFTEST|Exception|FATAL|at de\.samu" stage.log | grep -v "  hit " | grep -vE "\] t= *[0-9]+s bot hp" > events.log || true
          head -700 events.log; echo "===== ... ====="; tail -1500 events.log
          echo "===== LAST MINUTES ====="
          grep -E "\] t= *[0-9]+s bot hp" stage.log | tail -40 || true
          echo "===== RESULT ====="
          grep -E "\[SELFTEST\] (PASS|FAIL)|DONE" stage.log || true
          grep -q "\[SELFTEST\] DONE" stage.log
          # (The job shows red when the bot did not make it, so the result is visible at a glance.)
          grep -q "\[SELFTEST\] PASS" stage.log
      - name: Keep what the bot learned (also when the stage failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            minecraft-pvp-bot/run/config/pvpbot-memory.json
            minecraft-pvp-bot/run/config/pvpbot-tasks.json
          key: pvpbot-brain-stage${{ matrix.stage }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-${{ matrix.stage }}-log
          path: minecraft-pvp-bot/stage.log

  full:
    # The whole game from nothing, 1.5 hours of game time: slow is fine, stuck is not.
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore what the bot learned in earlier runs
        uses: actions/cache/restore@v4
        with:
          path: |
            minecraft-pvp-bot/run/config/pvpbot-memory.json
            minecraft-pvp-bot/run/config/pvpbot-tasks.json
          key: pvpbot-brain-full-${{ github.run_id }}
          restore-keys: pvpbot-brain-full-
      - name: Play Minecraft through, from an empty inventory
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          # New world each try; another try only after a death and while there is time left.
          for try in 1 2 3; do
            rm -rf run/world
            printf 'online-mode=false\nlevel-type=minecraft\\:normal\nlevel-seed=pvpbot-full-${{ github.run_number }}-'"$try"'\npause-when-empty-seconds=100000\ndifficulty=normal\nspawn-protection=0\ngenerate-structures=true\nview-distance=4\nsimulation-distance=6\n' > run/server.properties
            timeout 10800 ./gradlew --no-daemon runServer -Pselftest -Pstagetest=voll > full-$try.log 2>&1 || true
            echo "===== try $try (seed pvpbot-full-${{ github.run_number }}-$try, $((SECONDS/60)) min so far): $(grep -oE '\[SELFTEST\] (PASS|FAIL).*' full-$try.log | head -1)"
            grep -E "MILESTONE|STUCK|UNSTUCK|FULL RUN|bot gone" full-$try.log | sed 's/^.*\[SELFTEST\] *//' || true
            cp full-$try.log full.log
            grep -qE '\[SELFTEST\] FAIL.*botAlive=false' full-$try.log || break
            [ $SECONDS -lt 7200 ] || break
          done
          grep -E "SELFTEST|Exception|FATAL|at de\.samu" full.log | grep -v "  hit " | grep -vE "\] t= *[0-9]+s bot hp" > events.log || true
          echo "===== EVENTS (first) ====="; head -600 events.log
          echo "===== EVENTS (last) ====="; tail -800 events.log
          echo "===== RESULT ====="
          grep -hE "FULL RUN|\[SELFTEST\] (PASS|FAIL)" full-*.log || true
          grep -q "\[SELFTEST\] PASS" full.log
      - name: Keep what the bot learned
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            minecraft-pvp-bot/run/config/pvpbot-memory.json
            minecraft-pvp-bot/run/config/pvpbot-tasks.json
          key: pvpbot-brain-full-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-run-logs
          path: minecraft-pvp-bot/full-*.log

  parcours:
    # Training course: the traps from the full runs, each a hard test the bot has to pass.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore what the bot learned in earlier runs
        uses: actions/cache/restore@v4
        with:
          path: |
            minecraft-pvp-bot/run/config/pvpbot-memory.json
            minecraft-pvp-bot/run/config/pvpbot-tasks.json
          key: pvpbot-brain-parcours-${{ github.run_id }}
          restore-keys: pvpbot-brain-parcours-
      - name: Training course (flat test world)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\npause-when-empty-seconds=100000\ndifficulty=normal\nspawn-protection=0\ngenerate-structures=false\nview-distance=4\nsimulation-distance=6\n' > run/server.properties
          timeout 5400 ./gradlew --no-daemon runServer -Pselftest -Pstagetest=parcours > parcours.log 2>&1 || true
          grep -E "SELFTEST|Exception|FATAL|at de\.samu" parcours.log | grep -v "  hit " | grep -vE "\] t= *[0-9]+s bot hp" | grep -E "=====|parcours:|WATCHDOG|HARD UNSTUCK|bot took|bot gone|gather: |LEARN|PASS|FAIL|Exception|at de\.samu|explore:|dig:|kit:|tunnel|stuck|gatherer tick|springe|baue mich" | tail -1500 || true
          echo "===== RESULT ====="
          grep -E "\[SELFTEST\] (PASS|FAIL)" parcours.log || true
          grep -q "\[SELFTEST\] DONE" parcours.log
          ! grep -q "\[SELFTEST\] FAIL" parcours.log
      - name: Keep what the bot learned
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            minecraft-pvp-bot/run/config/pvpbot-memory.json
            minecraft-pvp-bot/run/config/pvpbot-tasks.json
          key: pvpbot-brain-parcours-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parcours-log
          path: minecraft-pvp-bot/parcours.log

  autopilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build autopilot
        run: ./gradlew --no-daemon :autopilot:build
      - uses: actions/upload-artifact@v4
        with:
          name: pvpbot-autopilot
          path: minecraft-pvp-bot/autopilot/build/libs/pvpbot-autopilot-*.jar
          if-no-files-found: error
      - name: In-game test with a real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          SDL_VIDEO_X11_FORCE_EGL: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers vulkan-tools mesa-utils ffmpeg > /dev/null
          Xvfb :99 -screen 0 1280x720x24+32 +extension GLX +render -noreset > /dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 glxinfo -B | head -12 || true
          DISPLAY=:99 vulkaninfo --summary 2>/dev/null | head -20 || true
          DISPLAY=:99 timeout 2700 ./gradlew --no-daemon :autopilot:runClientGameTest > clienttest.log 2>&1 || true
          grep -E "AUTOPILOT|Exception|FATAL|at de\.samu|Caused by" clienttest.log | grep -v "^\[SHOT" | head -1500
          grep -q "AUTOPILOT-TEST\] DONE" clienttest.log || tail -80 clienttest.log
          grep -q "AUTOPILOT-TEST\] DONE" clienttest.log
      - name: Screenshots (base64)
        if: always()
        run: grep "SHOT" clienttest.log | sed 's/^.*\[SHOT/[SHOT/' || true
      - name: Encode videos
        if: always()
        run: |
          mkdir -p videos
          for d in $(find . -type d -path '*pvpbot-frames/*' | sort); do
            n=$(basename "$d"); fps=$(cat "$d/fps"); count=$(ls "$d"/*.png 2>/dev/null | wc -l)
            echo "$n: $count frames @ $fps fps"
            [ "$count" -gt 0 ] || continue
            ffmpeg -loglevel error -y -framerate "$fps" -i "$d/%05d.png" -vf "scale=640:-2" \
              -c:v libx264 -preset slow -crf 30 -pix_fmt yuv420p -movflags +faststart "videos/$n.mp4"
          done
          ls -la videos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvpbot-videos
          path: minecraft-pvp-bot/videos/*.mp4
          if-no-files-found: warn
      - name: Videos (base64)
        if: always()
        run: |
          for f in videos/*.mp4; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .mp4)
            base64 -w 4000 "$f" | awk -v n="$n" '{print "[VID " n " " NR "] " $0}'
          done
  survival:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build autopilot
        run: ./gradlew --no-daemon :autopilot:build
      - uses: actions/upload-artifact@v4
        with:
          name: pvpbot-autopilot-survival-build
          path: minecraft-pvp-bot/autopilot/build/libs/pvpbot-autopilot-*.jar
          if-no-files-found: error
      - name: Autopilot gears up on its own (normal world, timelapse)
        env:
          JAVA_TOOL_OPTIONS: '-Dpvpbot.survivaltest=true -Dpvpbot.survivalminutes=22'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          SDL_VIDEO_X11_FORCE_EGL: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers vulkan-tools mesa-utils ffmpeg > /dev/null
          Xvfb :99 -screen 0 1280x720x24+32 +extension GLX +render -noreset > /dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 glxinfo -B | head -12 || true
          DISPLAY=:99 vulkaninfo --summary 2>/dev/null | head -20 || true
          DISPLAY=:99 timeout 3000 ./gradlew --no-daemon :autopilot:runClientGameTest > clienttest.log 2>&1 || true
          grep -E "AUTOPILOT-TEST|survival|Gestorben|Exception|FATAL|at de\.samu|Caused by" clienttest.log | grep -v "^\[SHOT" | head -3000
          echo "===== RESULT ====="
          grep -E "GOAL|SURVIVAL|DONE" clienttest.log || true
          grep -q "AUTOPILOT-TEST\] DONE" clienttest.log
      - name: Encode videos
        if: always()
        run: |
          mkdir -p videos
          for d in $(find . -type d -path '*pvpbot-frames/*' | sort); do
            n=$(basename "$d"); fps=$(cat "$d/fps"); count=$(ls "$d"/*.png 2>/dev/null | wc -l)
            echo "$n: $count frames @ $fps fps"
            [ "$count" -gt 0 ] || continue
            ffmpeg -loglevel error -y -framerate "$fps" -i "$d/%05d.png" -vf "scale=640:-2" \
              -c:v libx264 -preset slow -crf 30 -pix_fmt yuv420p -movflags +faststart "videos/$n.mp4"
          done
          ls -la videos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvpbot-survival-video
          path: minecraft-pvp-bot/videos/*.mp4
          if-no-files-found: warn
      - name: Videos (base64)
        if: always()
        run: |
          for f in videos/*.mp4; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .mp4)
            base64 -w 4000 "$f" | awk -v n="$n" '{print "[VID " n " " NR "] " $0}'
          done
  autopilot-parcours:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Autopilot training course (flat test world)
        env:
          JAVA_TOOL_OPTIONS: '-Dpvpbot.parcours=true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
          SDL_VIDEO_X11_FORCE_EGL: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 mesa-vulkan-drivers > /dev/null
          Xvfb :99 -screen 0 1280x720x24+32 +extension GLX +render -noreset > /dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 timeout 3300 ./gradlew --no-daemon :autopilot:runClientGameTest > clienttest.log 2>&1 || true
          grep -E "AUTOPILOT-PARCOURS|survival:|\[KI\]|Exception|FATAL|at de\.samu|Caused by" clienttest.log | head -4000
          echo "===== ERGEBNIS ====="
          grep -E "PARCOURS\] (PASS|FAIL|[0-9]+/)" clienttest.log || tail -80 clienttest.log
          grep -q "AUTOPILOT-TEST\] DONE" clienttest.log
          ! grep -q "PARCOURS\] FAIL" clienttest.log
