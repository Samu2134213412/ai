name: Tutor Desktop-App bauen

# Baut die Installer für Windows, macOS und Linux. Start: Actions → „Tutor Desktop-App bauen“ → Run workflow
# (Dateien als Artefakte am Lauf) oder ein Tag tutor-desktop-v* pushen (zusätzlich ein GitHub-Release mit
# Tutor.exe, Tutor.dmg, Tutor.AppImage – daraus laden install.ps1/install.sh die fertige Datei, ohne selbst zu bauen).
on:
  workflow_dispatch:
  push:
    tags: ["tutor-desktop-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tutor/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tutor/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # ohne Signierzertifikat bauen
      - uses: actions/upload-artifact@v4
        with:
          name: tutor-desktop-${{ matrix.os }}
          path: |
            tutor/desktop/dist/*.exe
            tutor/desktop/dist/*.dmg
            tutor/desktop/dist/*.AppImage
            tutor/desktop/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/tutor-desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
