<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Arbeitszimmer – Skizze von oben (nicht maßstäblich)</title>
  <rect width="640" height="800" fill="#ffffff"/>

  <!-- Zonen -->
  <rect x="60" y="60" width="520" height="210" fill="#fff3e0"/>
  <rect x="60" y="270" width="520" height="430" fill="#e8f5e9"/>
  <text x="140" y="85" fill="#b26a00" font-weight="600">VORNE – später (erst mit Eltern klären)</text>
  <text x="140" y="290" fill="#2e7d32" font-weight="600">HINTEN – Phase 1 (jetzt)</text>

  <!-- Raumumriss -->
  <rect x="60" y="60" width="520" height="640" fill="none" stroke="#333" stroke-width="3"/>
  <!-- Kniestock / Schrägen -->
  <rect x="60" y="60" width="70" height="640" fill="#9e9e9e" fill-opacity="0.15" stroke="#9e9e9e" stroke-dasharray="6 4"/>
  <rect x="510" y="60" width="70" height="640" fill="#9e9e9e" fill-opacity="0.15" stroke="#9e9e9e" stroke-dasharray="6 4"/>
  <text x="95" y="420" fill="#666" transform="rotate(-90 95 420)" text-anchor="middle">Schräge + Kniestock</text>
  <text x="545" y="420" fill="#666" transform="rotate(90 545 420)" text-anchor="middle">Schräge + Kniestock</text>

  <!-- Tür -->
  <rect x="270" y="52" width="100" height="16" fill="#795548"/>
  <text x="320" y="44" text-anchor="middle" fill="#333">Tür (du stehst hier für Foto 3)</text>

  <!-- Dachfenster: vorne bei der Tür, auf der Seite von Bett/Kallax -->
  <rect x="64" y="110" width="62" height="60" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
  <text x="140" y="135" fill="#1976d2">Dachfenster</text>
  <text x="140" y="151" fill="#1976d2">(klein, kipp)</text>

  <!-- PC auf dem Boden -->
  <rect x="230" y="312" width="40" height="45" fill="#424242"/>
  <text x="222" y="338" text-anchor="end" fill="#333" font-size="11">PC (Boden)</text>
  <!-- Steckdosenturm + Kabel -->
  <circle cx="380" cy="320" r="10" fill="#fafafa" stroke="#333"/>
  <text x="380" y="352" text-anchor="middle" fill="#c62828" font-size="11">Steckdosenturm + Kabel</text>

  <!-- Schränke am Kniestock -->
  <rect x="448" y="292" width="60" height="55" fill="#ffffff" stroke="#333"/>
  <text x="478" y="324" text-anchor="middle" font-size="11">Schränke</text>

  <!-- Schreibtisch quer, gerades Ende an den Schränken -->
  <path d="M508 370 H 260 Q 220 370 220 405 Q 220 440 260 440 H 508 Z" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <rect x="280" y="374" width="160" height="10" fill="#212121"/>
  <text x="370" y="412" text-anchor="middle" fill="#333">Schreibtisch</text>
  <text x="370" y="428" text-anchor="middle" fill="#666" font-size="11">Monitore an der Kante zur Tür</text>
  <!-- Stuhl -->
  <circle cx="370" cy="478" r="20" fill="#c62828" fill-opacity="0.85"/>
  <text x="400" y="483" fill="#333">Gaming-Stuhl</text>
  <text x="370" y="515" text-anchor="middle" fill="#666" font-size="11">du schaust Richtung Tür</text>

  <!-- Bett/Liege am anderen Kniestock -->
  <rect x="132" y="500" width="90" height="140" fill="#c8e6c9" stroke="#333"/>
  <text x="177" y="575" text-anchor="middle" font-size="11">Bett/Liege</text>

  <!-- Giebelwand hinten -->
  <rect x="60" y="700" width="520" height="8" fill="#333"/>
  <rect x="132" y="655" width="170" height="40" fill="#ffffff" stroke="#333"/>
  <text x="217" y="680" text-anchor="middle" font-size="11">Kallax (Lenkrad) + Schild</text>
  <rect x="340" y="668" width="44" height="28" fill="#ffffff" stroke="#333"/>
  <text x="362" y="662" text-anchor="middle" font-size="11">Regal</text>
  <!-- Deckenpanel -->
  <rect x="270" y="585" width="100" height="36" fill="none" stroke="#f9a825" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="320" y="608" text-anchor="middle" fill="#f57f17" font-size="11">Deckenpanel</text>
  <!-- TV an der Giebelwand -->
  <rect x="250" y="709" width="220" height="10" fill="#1565c0"/>
  <text x="360" y="738" text-anchor="middle" fill="#1565c0" font-weight="600">TV / virtuelles Fenster? (Giebelwand)</text>

  <!-- Licht an den Schrägen -->
  <line x1="128" y1="300" x2="128" y2="650" stroke="#ab47bc" stroke-width="5" stroke-opacity="0.6"/>
  <line x1="512" y1="355" x2="512" y2="695" stroke="#ab47bc" stroke-width="5" stroke-opacity="0.6"/>

  <text x="320" y="765" text-anchor="middle" fill="#8e24aa" font-size="11">lila = geplantes indirektes Licht auf die Schrägen (Profil auf Schränken/Kniestock)</text>
  <text x="320" y="785" text-anchor="middle" fill="#999" font-size="11">Skizze nach deinen Fotos – nicht maßstäblich, Maße fehlen noch</text>
</svg>
