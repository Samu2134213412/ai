name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML prüfen
        run: |
          pipx install yamllint
          yamllint homeassistant .github
      - name: Shell-Skripte prüfen
        run: shellcheck tools/*.sh
